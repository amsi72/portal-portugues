name: Publicar portal de Português

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar arquivos
        uses: actions/checkout@v4
      - name: Gerar site com o visual original
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import shutil, html, re, os
          src = Path('.')
          site = Path('_site')
          shutil.rmtree(site, ignore_errors=True)
          site.mkdir()
          for root, dirs, files in os.walk(src):
              dirs[:] = [d for d in dirs if d not in {'.git', '.github', '_site'}]
              for name in files:
                  p = Path(root) / name
                  rel = p.relative_to(src)
                  if p.suffix.lower() == '.php' or rel.as_posix() == 'templates/portal-template.html':
                      continue
                  dest = site / rel
                  dest.parent.mkdir(parents=True, exist_ok=True)
                  shutil.copy2(p, dest)
          template = Path('templates/portal-template.html').read_text(encoding='utf-8')
          for code, title, header in [('p2', 'Português 2', 'LÍNGUA PORTUGUESA — PORTUGUÊS 2 — 2º SEM. 2026'), ('p4', 'Português 4', 'LÍNGUA PORTUGUESA — PORTUGUÊS 4 — 2º SEM. 2026')]:
              folder = src / 'portugues' / code
              items = []
              if folder.exists():
                  files = sorted(folder.iterdir(), key=lambda x: x.name.lower())
                  for f in files:
                      if not f.is_file() or f.suffix.lower() != '.html' or f.name.lower() == 'index.html' or f.name.startswith(('.', '_')):
                          continue
                      raw = f.read_text(encoding='utf-8', errors='replace')[:300000]
                      m = re.search(r'<title\b[^>]*>(.*?)</title\s*>', raw, re.I | re.S)
                      label = html.unescape(re.sub(r'\s+', ' ', re.sub(r'<[^>]+>', '', m.group(1)))).strip() if m else ''
                      if not label:
                          label = re.sub(r'[_-]+', ' ', f.stem).strip().capitalize()
                      items.append(f'<li class="item-material"><a class="link-material" href="{html.escape(f.name, quote=True)}"><span class="link-material-texto">{html.escape(label)}</span><span class="link-material-seta" aria-hidden="true"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg></span></a></li>')
              listing = '<ul class="lista-materiais">' + ''.join(items) + '</ul>' if items else '<p class="mensagem-vazia">Nenhum material disponibilizado no momento.</p>'
              page = (template.replace('{{TITULO}}', title)
                      .replace('{{CABECALHO}}', header)
                      .replace('{CABECALHO}', header)
                      .replace('{{MATERIAIS}}', listing))
              target = site / 'portugues' / code / 'index.html'
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_text(page, encoding='utf-8')
          PY
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Preparar publicação
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Publicar site
        uses: actions/deploy-pages@v4
